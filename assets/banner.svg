<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 420" width="100%" height="100%">
  <defs>
    <!-- Background Gradients -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#090d16" />
      <stop offset="50%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#030712" />
    </linearGradient>

    <linearGradient id="titleGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8">
        <animate attributeName="stop-color" values="#38bdf8;#818cf8;#c084fc;#38bdf8" dur="8s" repeatCount="indefinite" />
      </stop>
      <stop offset="50%" stop-color="#818cf8">
        <animate attributeName="stop-color" values="#818cf8;#c084fc;#38bdf8;#818cf8" dur="8s" repeatCount="indefinite" />
      </stop>
      <stop offset="100%" stop-color="#c084fc">
        <animate attributeName="stop-color" values="#c084fc;#38bdf8;#818cf8;#c084fc" dur="8s" repeatCount="indefinite" />
      </stop>
    </linearGradient>

    <linearGradient id="cardGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e293b" stop-opacity="0.8" />
      <stop offset="100%" stop-color="#0f172a" stop-opacity="0.6" />
    </linearGradient>

    <!-- Glowing Orbs Filters -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="60" result="blur" />
    </filter>

    <filter id="cardShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#000000" flood-opacity="0.5"/>
    </filter>

    <!-- Grid Pattern -->
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#334155" stroke-width="0.75" stroke-opacity="0.3" />
      <circle cx="40" cy="40" r="1" fill="#475569" fill-opacity="0.4" />
    </pattern>
  </defs>

  <style>
    .title {
      font-family: system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      font-weight: 800;
      font-size: 42px;
      letter-spacing: -0.5px;
    }
    .subtitle {
      font-family: system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      font-weight: 500;
      font-size: 19px;
      fill: #94a3b8;
    }
    .badge-text {
      font-family: system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      font-weight: 600;
      font-size: 13px;
      fill: #e2e8f0;
    }
    .status-text {
      font-family: system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      font-weight: 700;
      font-size: 12px;
      letter-spacing: 0.5px;
    }
  </style>

  <!-- Deep Background -->
  <rect width="1200" height="420" fill="url(#bgGrad)" />

  <!-- Animated Glowing Background Orbs (Kept safely in background) -->
  <circle cx="200" cy="120" r="140" fill="#38bdf8" opacity="0.18" filter="url(#glow)">
    <animate attributeName="cx" values="180;260;180" dur="12s" repeatCount="indefinite" />
    <animate attributeName="cy" values="100;160;100" dur="10s" repeatCount="indefinite" />
  </circle>
  <circle cx="950" cy="280" r="160" fill="#818cf8" opacity="0.18" filter="url(#glow)">
    <animate attributeName="cx" values="950;880;950" dur="14s" repeatCount="indefinite" />
    <animate attributeName="cy" values="280;220;280" dur="11s" repeatCount="indefinite" />
  </circle>
  <circle cx="600" cy="350" r="130" fill="#c084fc" opacity="0.12" filter="url(#glow)">
    <animate attributeName="r" values="120;150;120" dur="8s" repeatCount="indefinite" />
  </circle>

  <!-- Subtle Blueprint Tech Grid -->
  <rect width="1200" height="420" fill="url(#grid)" />

  <!-- Flow / Circuit Connections (Dynamic Animated Pulses in Background) -->
  <g stroke-linecap="round" opacity="0.4">
    <path d="M 120 70 L 320 70" stroke="#38bdf8" stroke-width="2" stroke-dasharray="6,6">
      <animate attributeName="stroke-dashoffset" values="0;24" dur="2s" repeatCount="indefinite" />
    </path>
    <path d="M 880 70 L 1080 70" stroke="#c084fc" stroke-width="2" stroke-dasharray="6,6">
      <animate attributeName="stroke-dashoffset" values="24;0" dur="2s" repeatCount="indefinite" />
    </path>
  </g>

  <!-- Main Hero Titles (Foreground & Prominent) -->
  <g text-anchor="middle">
    <!-- Top Super-header / Kicker -->
    <rect x="495" y="45" width="210" height="28" rx="14" fill="#1e293b" stroke="#3b82f6" stroke-width="1.2" />
    <circle cx="512" cy="59" r="4" fill="#10b981">
      <animate attributeName="opacity" values="1;0.3;1" dur="2s" repeatCount="indefinite" />
    </circle>
    <text x="605" y="63" fill="#38bdf8" class="status-text">AUTONOMOUS QA 2026</text>

    <!-- Main Title -->
    <text x="600" y="125" class="title" fill="url(#titleGrad)">Awesome Advanced AI-Powered Testing</text>

    <!-- Subtitle -->
    <text x="600" y="165" class="subtitle">Self-Healing Locators • Visual AI Inspection • Natural Language Tests • Testing Agents</text>
  </g>

  <!-- Feature Pillar Cards (Dynamic Interactive UI Look in Foreground) -->
  <g transform="translate(100, 210)">
    <!-- Card 1: Self-Healing -->
    <g transform="translate(0, 0)" filter="url(#cardShadow)">
      <rect width="230" height="135" rx="14" fill="url(#cardGrad)" stroke="#38bdf8" stroke-width="1.2" stroke-opacity="0.6"/>
      <circle cx="34" cy="34" r="16" fill="#0284c7" fill-opacity="0.2" />
      <text x="34" y="40" font-size="18" text-anchor="middle">🩹</text>
      <text x="62" y="38" fill="#f8fafc" font-family="system-ui, sans-serif" font-weight="700" font-size="15">Self-Healing Locators</text>
      <text x="20" y="70" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="12">Automatic DOM repairs</text>
      <text x="20" y="90" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="12">Zero-flakiness selectors</text>
      <path d="M 20 115 L 210 115" stroke="#38bdf8" stroke-width="2" stroke-opacity="0.3"/>
      <circle cx="170" cy="115" r="3" fill="#38bdf8">
        <animate attributeName="cx" values="30;190;30" dur="4s" repeatCount="indefinite" />
      </circle>
    </g>

    <!-- Card 2: Visual AI -->
    <g transform="translate(255, 0)" filter="url(#cardShadow)">
      <rect width="230" height="135" rx="14" fill="url(#cardGrad)" stroke="#818cf8" stroke-width="1.2" stroke-opacity="0.6"/>
      <circle cx="34" cy="34" r="16" fill="#4f46e5" fill-opacity="0.2" />
      <text x="34" y="40" font-size="18" text-anchor="middle">👁️</text>
      <text x="62" y="38" fill="#f8fafc" font-family="system-ui, sans-serif" font-weight="700" font-size="15">Visual AI & Diffing</text>
      <text x="20" y="70" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="12">Multimodal computer vision</text>
      <text x="20" y="90" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="12">Local Ollama & Vision LLMs</text>
      <path d="M 20 115 L 210 115" stroke="#818cf8" stroke-width="2" stroke-opacity="0.3"/>
      <circle cx="90" cy="115" r="3" fill="#818cf8">
        <animate attributeName="cx" values="40;200;40" dur="5s" repeatCount="indefinite" />
      </circle>
    </g>

    <!-- Card 3: Natural Language -->
    <g transform="translate(510, 0)" filter="url(#cardShadow)">
      <rect width="230" height="135" rx="14" fill="url(#cardGrad)" stroke="#c084fc" stroke-width="1.2" stroke-opacity="0.6"/>
      <circle cx="34" cy="34" r="16" fill="#9333ea" fill-opacity="0.2" />
      <text x="34" y="40" font-size="18" text-anchor="middle">💬</text>
      <text x="62" y="38" fill="#f8fafc" font-family="system-ui, sans-serif" font-weight="700" font-size="15">Natural Language QA</text>
      <text x="20" y="70" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="12">Plain English test authoring</text>
      <text x="20" y="90" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="12">Codeless test steps & flows</text>
      <path d="M 20 115 L 210 115" stroke="#c084fc" stroke-width="2" stroke-opacity="0.3"/>
      <circle cx="140" cy="115" r="3" fill="#c084fc">
        <animate attributeName="cx" values="20;180;20" dur="3.5s" repeatCount="indefinite" />
      </circle>
    </g>

    <!-- Card 4: Autonomous Testing Agents -->
    <g transform="translate(765, 0)" filter="url(#cardShadow)">
      <rect width="235" height="135" rx="14" fill="url(#cardGrad)" stroke="#34d399" stroke-width="1.2" stroke-opacity="0.6"/>
      <circle cx="34" cy="34" r="16" fill="#059669" fill-opacity="0.2" />
      <text x="34" y="40" font-size="18" text-anchor="middle">🤖</text>
      <text x="62" y="38" fill="#f8fafc" font-family="system-ui, sans-serif" font-weight="700" font-size="15">Autonomous QA Agents</text>
      <text x="20" y="70" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="12">End-to-end plan & execution</text>
      <text x="20" y="90" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="12">MCP protocol & CLI runners</text>
      <path d="M 20 115 L 215 115" stroke="#34d399" stroke-width="2" stroke-opacity="0.3"/>
      <circle cx="50" cy="115" r="3" fill="#34d399">
        <animate attributeName="cx" values="50;205;50" dur="4.2s" repeatCount="indefinite" />
      </circle>
    </g>
  </g>

  <!-- Clean Bottom Edge Accent Bar -->
  <rect x="0" y="416" width="1200" height="4" fill="url(#titleGrad)" />
</svg>